[package]
name = "datahub-rust-backend-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "0.12", features = ["sqlx-postgres", "runtime-actix-native-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
